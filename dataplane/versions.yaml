  #   - 迁移失败不再遗留部署单元锁；创建副本时主库未就绪或 ACL 账号读取失败会明确失败，不再静默建成独立主库。
  #   - 升级包校验（agent 自升级、引擎升级、wrapper）统一一份检查，agent 自升级补上大小上限与摘要核对。
  #   - 许可读取失败与审计写入失败显式可见；api 服务端错误不再误报为 400。
  - product: 0.2.1

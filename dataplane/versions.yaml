# 产品版本 → 上游版本 + 已合入补丁（规格书 12 节）。
# 规则：
#   - 产品版本号的每一次变化都必须对应真实的代码变化；禁止只改版本号规避扫描。
#   - 安全补丁原样 backport 上游官方 commit，每个 CVE 一个文件 dataplane/patches/1xxx-cve-YYYY-NNNNN.patch。
#   - 本文件、BUILDINFO 与 SBOM 必须一致，scripts/check-versions.sh 校验（make ci）。
current: 0.2.2

releases:
  # 0.2.2：修复 0.2.1 在真实服务器上发现的两个缺陷，数据面二进制与补丁不变（上游 valkey 9.1.3、0001-sycache-rename.patch）。
  #   - 控制台引擎升级后版本目录权限为 0700，实例（sycache 用户）无法启动；现改为 0755。
  #   - agent 自升级后以退出码 0 退出，原 systemd 单元 Restart=on-failure 不会重启，主机一直离线；现改为 Restart=always。
  #   - 升级须重装 agent 包（DEB/RPM 或 install-agent.sh）：wrapper 与 systemd 单元不会被控制台的 agent 自升级替换，第一项修复在 wrapper 内。
  - product: 0.2.2
    upstream: valkey 9.1.3
    upstream_commit: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
    patches:
      - file: 0001-sycache-rename.patch
        kind: rename
    modules:
      - name: json
        version: 1.0.3
        commit_or_sha256: c839dcccc3570d24f2764c7025ca4cb8698e4ab6
      - name: search
        version: 1.2.1
        commit_or_sha256: 788e8c90063abab69d0d3fff32206f8491c633ca
      - name: bloom
        version: 1.0.1
        commit_or_sha256: 43b4e704bc8d6bd5f65529c8bd7e8488f2d54080
    cves: []




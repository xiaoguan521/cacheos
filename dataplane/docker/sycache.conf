# sycache 数据面镜像默认配置。k8s 部署时可只替换 requirepass 一行（sed）。
# 网络与安全配置
bind 0.0.0.0
port 6379
protected-mode no
requirepass Syndccc_6380

# 运行与存储路径
dir /data
pidfile /data/sycache-6379.pid

# 客户端与资源限制
maxclients 65535
maxmemory 8gb

# 日志配置
loglevel verbose
logfile /var/log/sycache/sycache-server.log

# 持久化配置
save 3600 1
appendonly yes

# 异步释放配置
lazyfree-lazy-expire yes

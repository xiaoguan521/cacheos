name: dataplane

# 触发：手动（Actions 页面 Run workflow），以及改动数据面相关路径的 PR（自动）。
# 上游 Tcl 测试集耗时长，只在手动勾选时运行。
on:
  workflow_dispatch:
    inputs:
      upstream_suite:
        description: "同时运行上游 Tcl 测试集（约 40 分钟）"
        type: boolean
        default: false
  pull_request:
    paths:
      - "dataplane/**"
      - "test/**"
      - "scripts/**"
      - "security/**"
      - "Makefile"
      - ".github/workflows/dataplane.yml"

permissions:
  contents: read

concurrency:
  group: dataplane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 必过：patch 可复现、构建、改名黄金验收、行为等价与上游互通（与本地 make ci 相同）
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libsystemd-dev pkg-config
      - name: Fetch upstream
        run: |
          source dataplane/UPSTREAM
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_GIT" upstream
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: make ci
        run: make ci UPSTREAM_SRC=upstream USE_SYSTEMD=yes
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: sycache-x86_64
          path: dist/*.tar.gz

  # 上游 Tcl 测试集跑在改名后的源码上。失败用例以 ::error:: 注解输出，可通过 API 读取；
  # 评审后登记到 test/upstream/known-diff.txt，清单收敛前本任务不阻断。
  upstream-suite:
    if: inputs.upstream_suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcl tcl-tls libssl-dev pkg-config
      - name: Fetch, patch, build and run
        run: test/upstream/run-suite.sh

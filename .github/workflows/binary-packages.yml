name: binary-packages

# 商业方案 5.3 的发布构建：在 glibc 2.17 兼容环境中生成
# sycache 的 tar.gz、RPM、DEB、调试符号包、BUILDINFO、SBOM 与校验清单；
# 同时把 glibc 2.17 兼容构建环境镜像发布到 GHCR，并在版本标签上创建
# GitHub Release，上传可下载的安装包与全量校验清单。
#
# 日常代码门禁由 dataplane.yml / p1-verify.yml 负责；本工作流只负责
# 可交付的二进制包，避免把宿主机临时构建产物误当成发布包。
on:
  workflow_dispatch:
    inputs:
      upstream_suite:
        description: "构建后运行上游 Tcl 功能测试集（约 40 分钟）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

# 默认只读；需要写 GHCR 的 job 在各自 job 内单独声明 packages: write。
permissions:
  contents: read

concurrency:
  group: binary-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-builder:
    name: publish build environment (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compatibility builder image
        uses: docker/build-push-action@v6
        with:
          context: ./dataplane/build-env
          build-args: |
            ARCH=${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          push: true
          # 可变标签 el7-<arch> 只在 v* 标签发布时更新，手动运行只产出不可变的 sha 标签，
          # 避免任意分支覆盖对外文档给出的官方标签。
          tags: |
            ghcr.io/${{ github.repository }}/build-env:sha-${{ github.sha }}-${{ matrix.arch }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/build-env:el7-{1}', github.repository, matrix.arch) || '' }}

  build:
    name: ${{ matrix.arch }} packages
    needs: publish-builder
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils dpkg-dev file
          docker version

      - name: Fetch and pin upstream source
        shell: bash
        run: |
          set -euo pipefail
          source dataplane/UPSTREAM
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_GIT" upstream
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Validate release tag against product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          product_version="$(awk '/^current:/{print $2}' dataplane/versions.yaml)"
          test -n "$product_version"
          test "$tag_version" = "$product_version" || {
            echo "tag $GITHUB_REF_NAME does not match dataplane/versions.yaml current $product_version" >&2
            exit 1
          }

      - name: Build compatibility packages
        env:
          CACHEOS_BUILD_IMAGE: ghcr.io/${{ github.repository }}/build-env:sha-${{ github.sha }}-${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          dataplane/build-compat.sh -s upstream -o dist
          # build-compat.sh builds inside Docker; make the workspace readable by
          # later Actions steps and by the runner cleanup hook.
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Verify package set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=(dist/sycache-[0-9]*-${{ matrix.arch }}.tar.gz)
          debs=(dist/sycache_*.deb)
          rpms=(dist/sycache-*.rpm)
          debug=(dist/sycache-debuginfo-[0-9]*-${{ matrix.arch }}.tar.gz)
          sbom=(dist/sycache-[0-9]*-${{ matrix.arch }}.spdx.json)
          test "${#tars[@]}" -eq 1
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -ge 1
          test "${#debug[@]}" -eq 1
          test "${#sbom[@]}" -eq 1
          test -s dist/BUILDINFO
          file "${tars[0]}" "${debs[0]}" "${rpms[@]}"

      - name: Run package provenance gates
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-vex.sh
          scripts/golden-rename.sh dist/sycache-[0-9]*-${{ matrix.arch }}.tar.gz
          scripts/check-versions.sh dist/sycache-[0-9]*-${{ matrix.arch }}.tar.gz

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cacheos-sycache-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/*.spdx.json
            dist/BUILDINFO
            dist/SHA256SUMS
            security/vex/*.csaf.json

  publish-builder-manifest:
    name: publish multi-arch build environment tag
    needs: [publish-builder, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/build-env"
          tags=(--tag "$image:sha-${GITHUB_SHA}")
          # 可变标签 el7 只在 v* 标签发布时更新。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(--tag "$image:el7"); fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "$image:sha-${GITHUB_SHA}-x86_64" \
            "$image:sha-${GITHUB_SHA}-aarch64"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: publish GitHub Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.ref_name }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE#v}"
          if ! gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE" \
              -R "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes-file docs/release-assets.md \
              --title "CacheOS $version"
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cacheos-sycache-*
          path: ${{ runner.temp }}/cacheos-artifacts
          merge-multiple: false

      - name: Collect release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/cacheos-artifacts"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"

          while IFS= read -r -d '' file; do
            relative="${file#"$source_dir/"}"
            artifact_name="${relative%%/*}"
            name="$(basename "$file")"
            case "$name" in
              SHA256SUMS)
                # 每个架构产物都有自己的清单；Release 使用下面重新生成的全量清单。
                continue
                ;;
              BUILDINFO)
                arch="${artifact_name#cacheos-sycache-}"
                destination="$assets/BUILDINFO-$arch"
                ;;
              *)
                destination="$assets/$name"
                ;;
            esac

            if [[ -e "$destination" ]]; then
              cmp -s "$file" "$destination" || {
                echo "duplicate release asset differs: $name" >&2
                exit 1
              }
            else
              cp "$file" "$destination"
            fi
          done < <(find "$source_dir" -type f -print0 | sort -z)

          test -s "$assets/BUILDINFO-x86_64"
          test -s "$assets/BUILDINFO-aarch64"
          test -n "$(find "$assets" -maxdepth 1 -type f -name 'sycache-*.tar.gz' -print -quit)"
          test -n "$(find "$assets" -maxdepth 1 -type f -name 'sycache_*.deb' -print -quit)"
          test -n "$(find "$assets" -maxdepth 1 -type f -name 'sycache-*.rpm' -print -quit)"

          (
            cd "$assets"
            sha256sum -- * | tee SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -lh "$assets"

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/release-assets"/*; do
            gh release upload "$RELEASE" -R "$GITHUB_REPOSITORY" --clobber "$file"
          done

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE#v}"
          if [[ "$version" == *-* ]]; then
            gh release edit "$RELEASE" -R "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=true --latest=false
          else
            gh release edit "$RELEASE" -R "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest=true
          fi

          {
            echo "## CacheOS $version"
            echo
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE"
            echo
            echo '### SHA256SUMS'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/release-assets/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  upstream-suite:
    if: inputs.upstream_suite
    name: upstream Tcl suite
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl tcl-tls libssl-dev pkg-config
      - name: Fetch upstream source
        shell: bash
        run: |
          set -euo pipefail
          source dataplane/UPSTREAM
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_GIT" upstream
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Run upstream suite
        run: test/upstream/run-suite.sh -s upstream

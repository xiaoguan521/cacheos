name: modules

# 扩展数据类型模块构建与烟雾测试（ADR 0002）。
# 触发：手动（workflow_dispatch），可指定要测试的模块（默认 json）。
# 策略：先构建 sycache-server，再编译所选模块，最后运行烟雾测试。
on:
  workflow_dispatch:
    inputs:
      module:
        description: "要构建和测试的模块（json、search、bloom；默认 json）"
        type: choice
        options:
          - json
          - search
          - bloom
        default: json

permissions:
  contents: read

concurrency:
  group: modules-${{ github.ref }}-${{ inputs.module || 'json' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build ${{ inputs.module || 'json' }} module and run smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libssl-dev libsystemd-dev pkg-config \
            cmake g++ gcc make git

          # search 模块额外依赖（cmake、ninja、compiler 版本升级）
          if [[ "${{ inputs.module || 'json' }}" == "search" ]]; then
            echo "安装 search 模块额外依赖..."
            # 确保 GCC 12+（Ubuntu 24.04 通常有 GCC 13）
            sudo apt-get install -y -qq ninja-build clang-tidy
            # 验证编译器版本
            gcc --version
            g++ --version
          fi
          echo "✓ 构建依赖安装完成"

      - name: Fetch upstream Valkey source
        run: |
          set -euo pipefail
          source dataplane/UPSTREAM
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_GIT" upstream
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          echo "✓ 上游源码已获取，commit: $UPSTREAM_COMMIT"

      - name: Build sycache-server
        run: |
          set -euo pipefail
          make sycache UPSTREAM_SRC="$PWD/upstream" USE_SYSTEMD=yes
          echo "✓ sycache-server 构建完成"
          ls -lh dist/sycache-*.tar.gz

      - name: Extract sycache binary
        run: |
          set -euo pipefail
          # 精确匹配主 tarball（不是 debuginfo）
          tarball=$(ls -1 dist/sycache-[0-9]*.tar.gz 2>/dev/null | head -1)
          if [[ -z "$tarball" ]]; then
            echo "ERROR: 未找到 sycache tarball"
            ls -la dist/ || true
            exit 1
          fi
          tar -C dist -xzf "$tarball"
          export SYCACHE_BIN="$PWD/dist/home/atwasoft/sycache/bin/sycache-server"
          test -f "$SYCACHE_BIN" || { echo "ERROR: SYCACHE_BIN 不存在: $SYCACHE_BIN"; exit 1; }
          echo "SYCACHE_BIN=$SYCACHE_BIN" >> "$GITHUB_ENV"
          echo "✓ sycache-server 二进制已提取"

      - name: Run module checks
        run: |
          set -euo pipefail
          make modules-check
          make brand
          echo "✓ 模块清单与品牌检查通过"

      - name: Restore built module cache
        id: modcache
        uses: actions/cache/restore@v4
        with:
          path: dist/valkey-*.so
          key: module-${{ inputs.module || 'json' }}-${{ hashFiles('dataplane/modules/MODULES', 'dataplane/build-modules.sh', 'dataplane/UPSTREAM', 'dataplane/modules/bloom/Cargo.lock', 'dataplane/modules/cargo-license-check.py') }}

      - name: Build module (${{ inputs.module || 'json' }})
        if: steps.modcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          module="${{ inputs.module || 'json' }}"
          dataplane/build-modules.sh -m "$module" -o dist
          echo "✓ 模块 $module 构建完成"
          ls -lh dist/valkey-*.so

      - name: Save built module cache
        if: steps.modcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/valkey-*.so
          key: module-${{ inputs.module || 'json' }}-${{ hashFiles('dataplane/modules/MODULES', 'dataplane/build-modules.sh', 'dataplane/UPSTREAM', 'dataplane/modules/bloom/Cargo.lock', 'dataplane/modules/cargo-license-check.py') }}

      - name: Check module shared-library dependencies
        run: |
          set -euo pipefail
          for so in dist/valkey-*.so; do
            echo "== $so =="
            readelf -d "$so" | grep NEEDED || true
            ldd "$so" || true
            if readelf -d "$so" | grep NEEDED | grep -Eqi 'libgpl|libreadline|libgmp|libmpfr'; then
              echo "ERROR: $so 链接了未经认定的 GPL/LGPL 系统库，需先评审（libsystemd 已认定允许）" >&2
              exit 1
            fi
          done

      - name: Run smoke tests
        env:
          SYCACHE_BIN: ${{ env.SYCACHE_BIN }}
        run: |
          set -euo pipefail
          module="${{ inputs.module || 'json' }}"
          case "$module" in
            json)
              JSON_SO="$PWD/dist/valkey-json.so" test/modules/json-smoke.sh "$SYCACHE_BIN"
              ;;
            search)
              SEARCH_SO="$PWD/dist/valkey-search.so" test/modules/search-smoke.sh "$SYCACHE_BIN"
              ;;
            bloom)
              BLOOM_SO="$PWD/dist/valkey-bloom.so" test/modules/bloom-smoke.sh "$SYCACHE_BIN"
              ;;
            *)
              echo "ERROR: 未知模块: $module"
              exit 1
              ;;
          esac
          echo "✓ 烟雾测试通过"

      - name: Cluster slot migration with module data
        if: ${{ (inputs.module || 'json') != 'search' }}
        run: |
          set -euo pipefail
          module="${{ inputs.module || 'json' }}"
          python3 -I test/modules/cluster-smoke.py "$module" "$SYCACHE_BIN" "dist/valkey-${module}.so"

      - name: Collect licenses and SBOM
        run: |
          set -euo pipefail
          python3 -I dataplane/modules/collect-licenses.py "${{ inputs.module || 'json' }}" dist
          echo "许可文本文件数: $(find dist/licenses -type f | wc -l)"

      - name: Package with module and verify layout
        run: |
          set -euo pipefail
          module="${{ inputs.module || 'json' }}"
          make sycache UPSTREAM_SRC="$PWD/upstream" USE_SYSTEMD=yes MODULES_DIST="$PWD/dist"
          tarball=$(ls -1 dist/sycache-[0-9]*.tar.gz | head -1)
          rm -rf pkgcheck && mkdir pkgcheck && tar -C pkgcheck -xzf "$tarball"
          R="$PWD/pkgcheck/home/atwasoft/sycache"
          test -x "$R/modules/${module}.so"
          test -s "$R/share/modules/${module}.spdx.json"
          test -n "$(find "$R/licenses/modules/${module}" -type f -print -quit)"
          grep -q "^modules=.*${module}:" "$R/share/BUILDINFO"
          grep -q "valkey-${module}" "$R/share/sbom.spdx.json"
          # 按实例的真实路径形态加载：<Root>/current/modules/<名>.so，且服务端是包内那一份
          ln -s . "$R/current"
          "$R/bin/sycache-server" --port 7399 --dir "$(mktemp -d)" --save "" --daemonize no \
            --loadmodule "$R/current/modules/${module}.so" >pkgcheck/server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          case "$module" in bloom) want=bf ;; *) want="$module" ;; esac
          ok=0
          for i in $(seq 1 40); do
            if python3 -I -c '
          import socket, sys
          s = socket.create_connection(("127.0.0.1", 7399), timeout=3)
          s.sendall(b"*2\r\n$6\r\nMODULE\r\n$4\r\nLIST\r\n")
          sys.exit(0 if sys.argv[1].encode() in s.recv(8192).lower() else 1)
          ' "$want" 2>/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          [[ $ok -eq 1 ]] || { echo "ERROR: 包内模块未能加载"; tail -30 pkgcheck/server.log; exit 1; }
          echo "✓ 安装包内模块布局正确并可加载"

      - name: Build optional modules package (tar, deb, rpm)
        run: |
          set -euo pipefail
          module="${{ inputs.module || 'json' }}"
          sudo apt-get install -y -qq rpm dpkg-dev
          mkdir -p pkgout
          dataplane/packaging/build-modules-package.sh dist pkgout -f tar,deb,rpm
          ls -l pkgout
          deb=$(ls pkgout/sycache-modules_*.deb); rpmf=$(ls pkgout/sycache-modules-*.rpm)
          dpkg-deb -I "$deb" | grep -E "Depends|Package|Version"
          dpkg-deb -c "$deb" | grep -q "modules/.*${module}"
          # 包里只能有本包自己的目录，不得与 sycache 主包重叠
          if dpkg-deb -c "$deb" | grep -E "sycache/(bin|conf|instances)/|systemd|logrotate"; then echo "ERROR: 与主包文件重叠"; exit 1; fi
          dpkg-deb -I "$deb" | grep -q "Depends:.*sycache (>="
          rpm -qp --requires "$rpmf" | tee pkgout/rpm-requires.txt
          grep -q "^sycache >=" pkgout/rpm-requires.txt
          rpm -qpl "$rpmf" | grep -q "modules/${module}.so"
          cp pkgout/* dist/ 2>/dev/null || true
          echo "✓ 可选模块包（tar / deb / rpm）构建并通过结构检查"

      - name: Module ABI report
        run: |
          set -euo pipefail
          module="${{ inputs.module || 'json' }}"
          so="dist/valkey-${module}.so"
          {
            echo "module=${module} size_bytes=$(stat -c %s "$so")"
            echo "needed: $(readelf -d "$so" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | tr '\n' ' ')"
            for v in GLIBC GLIBCXX CXXABI; do
              echo "max_${v}: $(objdump -T "$so" | grep -oE "${v}_[0-9]+(\.[0-9]+)+" | sed "s/${v}_//" | sort -Vu | tail -1)"
            done
            cp "$so" /tmp/stripped.so && strip --strip-unneeded /tmp/stripped.so
            echo "stripped_size_bytes=$(stat -c %s /tmp/stripped.so)"
          } | tee "dist/module-abi-${module}.txt"

      - name: ACL matrix for module commands
        run: |
          set -euo pipefail
          module="${{ inputs.module || 'json' }}"
          python3 -I test/modules/acl-matrix.py "$SYCACHE_BIN" "dist/valkey-${module}.so" "dist/acl-matrix-${module}.md"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ inputs.module || 'json' }}-x86_64
          path: |
            dist/valkey-*.so
            dist/*.log
            dist/bloom-Cargo.lock
            dist/acl-matrix-*.md
            dist/module-abi-*.txt
            dist/sycache-modules*
            dist/MODULES-BUILDINFO-*
            dist/rpm-requires.txt
            dist/licenses
            dist/sbom-*.spdx.json
            dist/sycache-*.tar.gz
          retention-days: 7

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modules-test-logs-${{ inputs.module || 'json' }}
          path: |
            /tmp/tmp.*/master*.log
            /tmp/tmp.*/server.log
          retention-days: 7
# 工作流文件已准备
